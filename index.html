		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #000000;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":325096,"index.wasm":37695054},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>

<style>
#ck-contest {
	position: fixed; inset: 0; z-index: 100;
	display: none; align-items: center; justify-content: center;
	background: rgba(0,0,0,0.82);
	font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
	padding: 16px; box-sizing: border-box;
}
#ck-contest.ck-open { display: flex; }
#ck-contest .ck-panel {
	background: #14161a; color: #f2f2f2; width: 100%; max-width: 380px;
	border: 2px solid #ffd91a; border-radius: 10px; padding: 20px;
	box-sizing: border-box;
}
#ck-contest h2 { margin: 0 0 4px; font-size: 19px; color: #ffd91a; letter-spacing: .5px; }
#ck-contest .ck-sub { margin: 0 0 16px; font-size: 13px; color: #9aa0a6; }
#ck-contest label { display: block; font-size: 13px; margin-bottom: 12px; }
#ck-contest input[type=text], #ck-contest input[type=email] {
	display: block; width: 100%; box-sizing: border-box; margin-top: 5px;
	padding: 12px; font-size: 16px; /* 16px stops iOS zooming on focus */
	border-radius: 6px; border: 1px solid #444; background: #0c0d10; color: #fff;
}
#ck-contest .ck-check { display: flex; gap: 9px; align-items: flex-start; font-size: 12px; color: #c8ccd0; line-height: 1.45; }
#ck-contest .ck-check input { margin-top: 2px; width: 18px; height: 18px; flex: none; }
#ck-contest .ck-actions { display: flex; gap: 10px; margin-top: 18px; }
#ck-contest button {
	flex: 1; padding: 14px 10px; font-size: 15px; font-weight: 600;
	border-radius: 6px; border: 0; cursor: pointer; min-height: 46px;
}
#ck-submit { background: #ffd91a; color: #14161a; }
#ck-skip { background: #2a2e35; color: #d0d4d8; }
#ck-contest button[disabled] { opacity: .55; cursor: default; }
#ck-status { min-height: 18px; margin: 12px 0 0; font-size: 13px; color: #9aa0a6; }
#ck-status.ck-err { color: #ff7a7a; }
#ck-status.ck-ok { color: #8ce99a; }
#ck-contest a { color: #ffd91a; }
</style>

<div id="ck-contest" role="dialog" aria-modal="true" aria-labelledby="ck-title">
	<div class="ck-panel">
		<h2 id="ck-title">ENTER YOUR SCORE!</h2>
		<p class="ck-sub" id="ck-sub"></p>
		<label>Name<input id="ck-name" type="text" maxlength="80" autocomplete="name" enterkeyhint="next"></label>
		<label>Email<input id="ck-email" type="email" maxlength="120" autocomplete="email" inputmode="email" enterkeyhint="done"></label>
		<label class="ck-check"><input id="ck-consent" type="checkbox"><span id="ck-consent-text">I agree to be contacted about the prize draw.</span></label>
		<div class="ck-actions">
			<button id="ck-skip" type="button">No thanks</button>
			<button id="ck-submit" type="button">Enter</button>
		</div>
		<p id="ck-status"></p>
	</div>
</div>

<script>
(function () {
	var cfg = null;
	var el = function (id) { return document.getElementById(id); };

	var API = {
		// Polled by the game each frame: "closed" while hidden, "open" while the
		// player is filling it in. The game freezes its auto-restart on "open".
		state: "closed",
		result: "",

		show: function (json) {
			try { cfg = JSON.parse(json); } catch (e) { return; }
			el("ck-sub").textContent = "Your score: " + cfg.score + "   (" + cfg.initials + ")";
			if (cfg.privacy_url) {
				var a = document.createElement("a");
				a.href = cfg.privacy_url; a.target = "_blank"; a.rel = "noopener";
				a.textContent = " Privacy notice";
				el("ck-consent-text").appendChild(a);
			}
			el("ck-status").textContent = "";
			el("ck-status").className = "";
			el("ck-submit").disabled = false;
			el("ck-contest").classList.add("ck-open");
			API.state = "open";
			setTimeout(function () { el("ck-name").focus(); }, 50);
		},

		close: function (result) {
			el("ck-contest").classList.remove("ck-open");
			API.result = result;
			API.state = "closed";
			// Hand the keyboard back, or the game stops receiving input entirely.
			var c = document.getElementById("canvas");
			if (c) { c.focus(); }
		}
	};

	function fail(msg) {
		var s = el("ck-status");
		s.textContent = msg;
		s.className = "ck-err";
		el("ck-submit").disabled = false;
	}

	function submit() {
		var name = el("ck-name").value.trim();
		var email = el("ck-email").value.trim();
		if (name.length < 1) { fail("Please enter your name."); return; }
		if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { fail("That email doesn't look right."); return; }
		if (!el("ck-consent").checked) { fail("Please tick the box to enter."); return; }

		el("ck-submit").disabled = true;
		el("ck-status").className = "";
		el("ck-status").textContent = "Sending...";

		var body = {
			initials: cfg.initials, full_name: name, email: email,
			score: cfg.score, boards: cfg.boards
		};
		var ctrl = new AbortController();
		var timer = setTimeout(function () { ctrl.abort(); }, 8000);

		fetch(cfg.url + "/rest/v1/contest_entries", {
			method: "POST",
			headers: {
				"apikey": cfg.key,
				"Authorization": "Bearer " + cfg.key,
				"Content-Type": "application/json",
				"Prefer": "return=minimal"
			},
			body: JSON.stringify(body),
			signal: ctrl.signal
		}).then(function (r) {
			clearTimeout(timer);
			if (r.ok) {
				var s = el("ck-status");
				s.textContent = "You're in. Good luck!";
				s.className = "ck-ok";
				setTimeout(function () { API.close("submitted"); }, 1400);
			} else {
				return r.text().then(function (t) { fail("Could not send (" + r.status + ")."); });
			}
		}).catch(function () {
			clearTimeout(timer);
			fail("No connection. Please try again.");
		});
	}

	function wire() {
		el("ck-submit").addEventListener("click", submit);
		el("ck-skip").addEventListener("click", function () { API.close("skipped"); });
		el("ck-email").addEventListener("keydown", function (e) {
			if (e.key === "Enter") { submit(); }
		});
		// Keys typed in the form must never reach the game underneath.
		el("ck-contest").addEventListener("keydown", function (e) { e.stopPropagation(); });
		window.CKContest = API;
	}

	if (document.readyState === "loading") {
		document.addEventListener("DOMContentLoaded", wire);
	} else {
		wire();
	}
})();
</script>


<script>
(function () {
	// Android Chrome's URL bar overlays the top of the canvas in landscape,
	// which on a handheld crops the board. Going fullscreen on the first touch
	// reclaims it.
	//
	// Notes on the awkward bits:
	//  - it must run inside a genuine user-gesture handler, so this is wired to
	//    the DOM rather than driven from the engine;
	//  - it targets documentElement, NOT the canvas, or the prize-draw overlay
	//    (a sibling of the canvas) would be hidden while fullscreen;
	//  - touch devices only, so desktop players are not yanked into fullscreen
	//    by an ordinary click;
	//  - orientation is deliberately NOT locked - portrait plays fine and
	//    forcing a rotation would be worse than the problem;
	//  - iOS Safari has no element fullscreen and will simply ignore all this.
	var coarse = (navigator.maxTouchPoints || 0) > 0 ||
		(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
	if (!coarse) { return; }

	var userLeft = false;

	function goFullscreen() {
		if (userLeft) { return; }
		if (document.fullscreenElement || document.webkitFullscreenElement) { return; }
		var el = document.documentElement;
		var req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
		if (!req) { return; }
		try {
			var p = req.call(el);
			if (p && p.catch) { p.catch(function () {}); }
		} catch (e) { /* not permitted in this context - try again next gesture */ }
	}

	// If they deliberately leave fullscreen, respect it and stop asking.
	document.addEventListener("fullscreenchange", function () {
		if (!document.fullscreenElement) { userLeft = true; }
	});

	window.addEventListener("touchend", goFullscreen, { passive: true });
	window.addEventListener("pointerup", goFullscreen, { passive: true });
})();
</script>
